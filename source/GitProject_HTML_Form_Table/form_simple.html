<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Đơn Giản</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }
    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    h2 {
      color: #1e3a8a;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      font-weight: bold;
      color: #334155;
      display: inline-block;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
    }
    .checkbox-group label {
      font-weight: normal;
      margin-right: 15px;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .btn-reset {
      background-color: #e2e8f0;
      color: #475569;
    }
    .btn-reset:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Thông Tin Người Dùng</h2>
    <form action="" method="POST">
      <!-- Họ và tên -->
      <div class="form-group">
        <label for="yourname">Họ và tên:</label>
        <input type="text" id="yourname" name="yourname" class="form-control" placeholder="Nhập họ và tên..." required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com" required>
      </div>

      <!-- Sở thích -->
      <div class="form-group checkbox-group">
        <label>Sở thích:</label><br>
        <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
        <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
        <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
        <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
      </div>

      <!-- Các nút bấm -->
      <div class="btn-group">
        <button type="submit" class="btn btn-submit">Gửi thông tin</button>
        <button type="reset" class="btn btn-reset">Nhập lại</button>
      </div>
    </form>
  </div>

</body>
</html>
