<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Học Viên</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .form-wrapper {
      background: #ffffff;
      width: 100%;
      max-width: 620px;
      padding: 30px 35px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    h2 {
      color: #0f766e;
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      text-transform: uppercase;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .form-row {
      margin-bottom: 16px;
    }
    label.field-title {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
    }
    .required {
      color: #dc2626;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    textarea {
      resize: vertical;
    }
    .options-group label {
      font-weight: normal;
      margin-right: 18px;
      cursor: pointer;
    }
    .options-group input {
      margin-right: 5px;
    }
    .form-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }
    .btn {
      flex: 1;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit {
      background-color: #0f766e;
      color: #ffffff;
    }
    .btn-submit:hover {
      background-color: #115e59;
    }
    .btn-reset {
      background-color: #e2e8f0;
      color: #475569;
    }
    .btn-reset:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <h2>Đăng Ký Học Viên</h2>
    <form action="" method="POST">
      
      <!-- 1. Họ và tên -->
      <div class="form-row">
        <label class="field-title" for="fullname">Họ và tên <span class="required">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ và tên..." required>
      </div>

      <!-- 2. Email -->
      <div class="form-row">
        <label class="field-title" for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <!-- 3. Số điện thoại -->
      <div class="form-row">
        <label class="field-title" for="phone">Số điện thoại <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="0912345678" pattern="[0-9]{10,11}" required>
      </div>

      <!-- 4. Ngày sinh -->
      <div class="form-row">
        <label class="field-title" for="birthday">Ngày sinh</label>
        <input type="date" id="birthday" name="birthday">
      </div>

      <!-- 5. Giới tính -->
      <div class="form-row">
        <label class="field-title">Giới tính</label>
        <div class="options-group">
          <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
          <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
          <label><input type="radio" name="gender" value="Khác"> Khác</label>
        </div>
      </div>

      <!-- 6. Địa chỉ -->
      <div class="form-row">
        <label class="field-title" for="address">Địa chỉ</label>
        <textarea id="address" name="address" rows="2" placeholder="Nhập địa chỉ cư trú..."></textarea>
      </div>

      <!-- 7. Khóa học -->
      <div class="form-row">
        <label class="field-title" for="course">Khóa học đăng ký</label>
        <select id="course" name="course">
          <option value="HTML & CSS">HTML & CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Java">Java</option>
          <option value="Python">Python</option>
        </select>
      </div>

      <!-- 8. Hình thức học -->
      <div class="form-row">
        <label class="field-title">Hình thức học</label>
        <div class="options-group">
          <label><input type="radio" name="study_type" value="Online" checked> Online</label>
          <label><input type="radio" name="study_type" value="Offline"> Offline</label>
        </div>
      </div>

      <!-- 9. Sở thích -->
      <div class="form-row">
        <label class="field-title">Sở thích</label>
        <div class="options-group">
          <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label>
          <label><input type="checkbox" name="hobby" value="Lập trình"> Lập trình</label>
          <label><input type="checkbox" name="hobby" value="Du lịch"> Du lịch</label>
          <label><input type="checkbox" name="hobby" value="Âm nhạc"> Âm nhạc</label>
        </div>
      </div>

      <!-- 10. Ghi chú -->
      <div class="form-row">
        <label class="field-title" for="note">Ghi chú thêm</label>
        <textarea id="note" name="note" rows="3" placeholder="Nhập yêu cầu đặc biệt nếu có..."></textarea>
      </div>

      <!-- Các nút bấm -->
      <div class="form-actions">
        <button type="submit" class="btn btn-submit">Đăng ký</button>
        <button type="reset" class="btn btn-reset">Nhập lại</button>
      </div>

    </form>
  </div>

</body>
</html>
