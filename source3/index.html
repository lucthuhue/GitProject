<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- Thẻ hiển thị hình ảnh với thuộc tính src và alt -->
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" 
         alt="Bãi biển nhiệt đới tuyệt đẹp với cát trắng và làn nước biển trong xanh" 
         width="600" 
         style="max-width: 100%; height: auto; border-radius: 8px;">

    <p>Đây là hình ảnh phong cảnh bãi biển nhiệt đới được nhúng vào trang web bằng thẻ <code>&lt;img&gt;</code>.</p>

</body>
</html>
